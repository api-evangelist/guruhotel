aid: guruhotel
name: GuruHotel
description: >-
  GuruHotel is AI-native direct-booking infrastructure for independent hotels: an AI-powered
  hotel website builder, a conversion-optimized direct booking engine, and a Stripe-powered
  payment-orchestration platform that turns a hotel's official website into a commission-free
  direct booking channel with real-time inventory, multi-currency checkout and a guest-first
  experience. Founded in 2019, GuruHotel is trusted by 1000+ hotels, serves 200,000+ guests a
  year and processes $15M+ in annual gross booking value across the United States, Mexico, the
  Caribbean and Europe. It connects to hotel PMS platforms directly (Cloudbeds) and through
  Channex (280+ PMS incl. Mews, apaleo, Oracle OPERA Cloud, Guesty, Hostaway), plus Google for
  Hotels. GuruHotel is a portfolio company of 500 Global and Anthemis.
